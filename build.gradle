/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {

	ext.kotlin_version = '2.2.0'

	repositories {
		mavenCentral()
		google()
		maven { url "https://plugins.gradle.org/m2/" }
	}

	dependencies {
		classpath 'com.android.tools.build:gradle:8.7.0'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		classpath "com.diffplug.spotless:spotless-plugin-gradle:8.8.0"
	}
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
	repositories {
		mavenCentral()
		google()
	}

	// Spotless apply for clean code formatting
	apply plugin: "com.diffplug.spotless"

	spotless {
		kotlin {
			target "TeamCode/src/main/**/*.kt", "TeamCode/src/main/**/*.kt"
			targetExclude "**/build/**/*.kt", "**/.gradle/**/*.kt"

			ktlint()
					.setEditorConfigPath(rootProject.file('formatConfig/.editorconfig'))
		}
		groovyGradle {
			target "**/*.gradle"

			greclipse()
			trimTrailingWhitespace()
			endWithNewline()
		}
		kotlinGradle {
			target "**/*.gradle.kts"

			ktlint()
					.setEditorConfigPath(rootProject.file('formatConfig/.editorConfig'))
		}
		java {
			target "TeamCode/src/main/**/*.java", "TeamCode/src/test/**/*.java"
			targetExclude "**/build/**/*.java", "**/.gradle/**/*.java"

			eclipse()
					.configFile(rootProject.file('formatConfig/java-format.xml'))

			importOrder()
			removeUnusedImports()
			trimTrailingWhitespace()
			endWithNewline()
		}
	}
}

repositories {
	mavenCentral()
}
